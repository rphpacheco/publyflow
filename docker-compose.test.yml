services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: publyflow_test
    ports:
      - "54329:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./docker/test-db-init:/docker-entrypoint-initdb.d:ro
